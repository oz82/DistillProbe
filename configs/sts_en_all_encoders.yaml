# STS with every student, baseline and reference encoder in one run (task-level retention table).
module: sts
data_path: data/sts/en_stsb_test.json
seed: 42
bootstrap_n: 10000
output_dir: results
encoders:
  m2v_potion:
    type: model2vec
    model_id: minishlab/potion-multilingual-128M
    role: student
  m2v_multilingual_output:
    type: model2vec
    model_id: minishlab/M2V_multilingual_output
    role: student
  m2v_bgem3_pca256_sif:
    type: model2vec
    model_id: models/m2v_bgem3_pca256_sif
    role: student
  st_static_mrl:
    type: transformer
    model_id: sentence-transformers/static-similarity-mrl-multilingual-v1
    role: student
  wada_gte256_en:
    type: static_wordvec
    path: external/swe4semantics/embeddings/swe_gte256_en.txt
    role: student
  fasttext_en:
    type: fasttext
    path: data/fasttext/cc.en.300.bin
    role: baseline
  labse:
    type: transformer
    model_id: sentence-transformers/LaBSE
    pool: mean
    role: reference
  me5_base:
    type: transformer
    model_id: intfloat/multilingual-e5-base
    pool: mean
    role: reference
