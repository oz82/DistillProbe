# SECONDARY (upper-bound) polysemy probe: v3_aug augments sense prototypes with
# PARSEME sentences assigned via LaBSE argmax, which leaks the reference encoder
# into prototype construction and inflates Spearman (0.491 vs 0.365 leak-free).
# The PRIMARY result uses configs/polysemy_v3_primary.yaml (un-augmented v3).
module: polysemy
data_path: data/polysemy/tr_polysemy.v3_aug.json
seed: 42
bootstrap_n: 10000
control_perms: 1000
output_dir: results
encoders:
  m2v_potion:
    type: model2vec
    model_id: minishlab/potion-multilingual-128M
  labse:
    type: transformer
    model_id: sentence-transformers/LaBSE
    pool: mean
