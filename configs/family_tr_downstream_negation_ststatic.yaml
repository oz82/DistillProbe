# C2 distillation-family ablation (TR). Student: sentence-transformers/static-similarity-mrl-multilingual-v1 (static embeddings trained from scratch with contrastive/Matryoshka loss, no teacher) — a non-distilled static family.
module: downstream_negation
data_path: data/sts/tr_negation_sentiment.json
seed: 42
output_dir: results
encoders:
  st_static_mrl:
    type: transformer
    model_id: sentence-transformers/static-similarity-mrl-multilingual-v1
    role: student
  fasttext_tr:
    type: fasttext
    path: data/fasttext/cc.tr.300.bin
    role: baseline
  labse:
    type: transformer
    model_id: sentence-transformers/LaBSE
    pool: mean
    role: reference
  me5_base:
    type: transformer
    model_id: intfloat/multilingual-e5-base
    pool: mean
    role: reference
