# Cross-lingual probe with bge-m3 — potion-multilingual-128M's ACTUAL teacher —
# added alongside LaBSE. Lets us report potion's retention relative to its true
# teacher (bge-m3) vs the reference encoder (LaBSE), partially disentangling the
# teacher/recipe confound flagged in the encoder ablation (§6.1, P0-4).
module: xlingual
data_path: data/xlingual/tr_flores.v3.json
seed: 42
bootstrap_n: 10000
extra:
  csls_k: 10
output_dir: results
encoders:
  m2v_potion:
    type: model2vec
    model_id: minishlab/potion-multilingual-128M
  labse:
    type: transformer
    model_id: sentence-transformers/LaBSE
    pool: mean
  bge_m3:
    type: transformer
    model_id: BAAI/bge-m3
    pool: mean
