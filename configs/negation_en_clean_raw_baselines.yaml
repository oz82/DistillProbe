# English negation battery (WordNet antonyms, cleaned), raw mode with fastText baseline; mirrors negation_v3_clean_raw_baselines.yaml.
module: negation
data_path: data/negation/en_negation.v3_clean.json
seed: 42
bootstrap_n: 10000
output_dir: results
encoders:
  m2v_potion:
    type: model2vec
    model_id: minishlab/potion-multilingual-128M
  labse:
    type: transformer
    model_id: sentence-transformers/LaBSE
    pool: mean
  fasttext_en:
    type: fasttext
    path: data/fasttext/cc.en.300.bin
