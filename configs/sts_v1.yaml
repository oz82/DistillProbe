module: sts
data_path: data/sts/tr_stsb_test.json
seed: 42
bootstrap_n: 10000
output_dir: results
encoders:
  m2v_potion:
    type: model2vec
    model_id: minishlab/potion-multilingual-128M
  m2v_multilingual_output:
    type: model2vec
    model_id: minishlab/M2V_multilingual_output
  labse:
    type: transformer
    model_id: sentence-transformers/LaBSE
    pool: mean
  me5_base:
    type: transformer
    model_id: intfloat/multilingual-e5-base
    pool: mean
