# English negation battery, carrier mode. Carrier mirrors the Turkish 'Bu çok {x}(değil).'
module: negation
data_path: data/negation/en_negation.v3_clean.json
seed: 42
bootstrap_n: 10000
output_dir: results
extra:
  use_carrier: true
  carrier_pos: "This is very {x}."
  carrier_neg: "This is not very {x}."
  carrier_ant: "This is very {x}."
encoders:
  m2v_potion:
    type: model2vec
    model_id: minishlab/potion-multilingual-128M
  labse:
    type: transformer
    model_id: sentence-transformers/LaBSE
    pool: mean
  fasttext_en:
    type: fasttext
    path: data/fasttext/cc.en.300.bin
