# A1 controlled-distillation ablation (morphology). Student: LaBSE teacher + plain PCA-256/Zipf recipe (pre-Tokenlearn Model2Vec release).
# One student per config because several modules select a single student encoder.
module: morphology
data_path: data/morphology/tr_categories.v3.json
seed: 42
bootstrap_n: 10000
output_dir: results
encoders:
  m2v_multilingual_output:
    type: model2vec
    model_id: minishlab/M2V_multilingual_output
  fasttext_tr:
    type: fasttext
    path: data/fasttext/cc.tr.300.bin
