# English polysemy battery (WordNet glosses + examples; leak-free like polysemy_v3_primary.yaml).
module: polysemy
data_path: data/polysemy/en_polysemy.v2.json
seed: 42
bootstrap_n: 10000
control_perms: 1000
output_dir: results
encoders:
  m2v_potion:
    type: model2vec
    model_id: minishlab/potion-multilingual-128M
  labse:
    type: transformer
    model_id: sentence-transformers/LaBSE
    pool: mean
