# A1 controlled-distillation ablation (cross-lingual, FLORES). Three students share the reference set:
# potion (bge-m3 + Tokenlearn), M2V_multilingual_output (LaBSE + PCA/Zipf), m2v_bgem3_pca256_sif (bge-m3 + PCA/SIF).
module: xlingual
data_path: data/xlingual/tr_flores.v3.json
seed: 42
bootstrap_n: 10000
output_dir: results
encoders:
  m2v_potion:
    type: model2vec
    model_id: minishlab/potion-multilingual-128M
  m2v_multilingual_output:
    type: model2vec
    model_id: minishlab/M2V_multilingual_output
  m2v_bgem3_pca256_sif:
    type: model2vec
    model_id: models/m2v_bgem3_pca256_sif
  labse:
    type: transformer
    model_id: sentence-transformers/LaBSE
    pool: mean
  me5_base:
    type: transformer
    model_id: intfloat/multilingual-e5-base
    pool: mean
