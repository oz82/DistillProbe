# C2 distillation-family ablation (TR). Student: sentence-transformers/static-similarity-mrl-multilingual-v1 (static embeddings trained from scratch with contrastive/Matryoshka loss, no teacher) — a non-distilled static family.
module: syntax_v2
data_path: data/syntax/tr_syntax.v1.json
seed: 42
bootstrap_n: 10000
output_dir: results
encoders:
  st_static_mrl:
    type: transformer
    model_id: sentence-transformers/static-similarity-mrl-multilingual-v1
    role: student
extra:
  teacher_model_id: sentence-transformers/LaBSE
  teacher_max_length: 256
