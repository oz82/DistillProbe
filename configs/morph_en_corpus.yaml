# English morphology battery (UD English-EWT + UniMorph cross-check), mirrors morph_v2_corpus.yaml.
module: morphology
data_path: data/morphology/en_categories.v1.json
seed: 42
bootstrap_n: 10000
output_dir: results
encoders:
  m2v_potion:
    type: model2vec
    model_id: minishlab/potion-multilingual-128M
  fasttext_en:
    type: fasttext
    path: data/fasttext/cc.en.300.bin
