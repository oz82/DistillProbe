[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distillprobe"
version = "0.1.0"
description = "A probing framework for distilled static embeddings (Model2Vec family)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Özkan Aslan" }]
keywords = ["nlp", "probing", "static-embeddings", "model2vec", "distillation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "model2vec==0.8.1",
    "gensim>=4.3,<5",
    "numpy>=1.24,<3",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
teacher = [
    "sentence-transformers>=2.7,<3",
]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]
annotation = [
    "openpyxl>=3.1",
    "krippendorff>=0.6",
]

[project.scripts]
distillprobe = "distillprobe.cli:main"

[tool.setuptools.packages.find]
include = ["distillprobe*"]
exclude = ["tests*", "data*", "results*", "configs*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
